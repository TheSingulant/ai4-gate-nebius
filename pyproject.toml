[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4-gate-nebius-hackathon"
version = "0.3.0"
description = "Hackathon prototype: a Nemotron coding agent whose tool calls pass through a verifiable authorization gate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "The Singulant L.L.C-FZ" }]
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gate-demo = "gate_demo.demo:main"
gate-demo-server = "gate_demo.server:main"
gate-live-e2e = "gate_demo.live_e2e:main"
gate-verify = "gate_verify.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gate_demo = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "live: real Nebius Token Factory call; skipped unless NEBIUS_API_KEY is set",
]
