# Private preview. Does not publish the app by itself.
# From this directory: docker compose up -d --build
# Set SITE_ADDRESS and PREVIEW_ACCESS_TOKEN in the environment or in .env.
# Do not commit .env.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      PLANNER: auto
      AUTHORIZER: reference
      GATE_BUDGET_DB: /app/data/budget.sqlite3
      GATE_SESSION_ROOT: /app/data/sessions
      GATE_SIGNING_KEY_FILE: /app/data/signing.pem
      GATE_APPROVER_KEY_FILE: /app/data/approver.pem
      GATE_TRUST_PROXY: "1"
      PREVIEW_HSTS: "1"
      GATE_MODE: guided
      GATE_LIVE_INTERVAL_SECONDS: "600"
    volumes:
      - gate-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gate-data:
  caddy-data:
  caddy-config:
